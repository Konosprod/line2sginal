name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package
        run: |
          mkdir -p dist pkg
          cp target/release/line2signal assets/line2signal.desktop pkg/
          cp assets/icon.png pkg/line2signal.png
          tar -czf dist/line2signal-linux-x86_64.tar.gz -C pkg .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/line2signal.exe dist/line2signal-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Package universal .app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP="dist/LINE to Signal.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp assets/icon.icns "$APP/Contents/Resources/icon.icns"
          lipo -create -output "$APP/Contents/MacOS/line2signal" \
            target/aarch64-apple-darwin/release/line2signal \
            target/x86_64-apple-darwin/release/line2signal
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>LINE to Signal</string>
            <key>CFBundleDisplayName</key><string>LINE to Signal</string>
            <key>CFBundleIdentifier</key><string>io.github.line2signal</string>
            <key>CFBundleExecutable</key><string>line2signal</string>
            <key>CFBundleIconFile</key><string>icon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          cd dist && ditto -c -k --keepParent "LINE to Signal.app" line2signal-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip

  release:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
