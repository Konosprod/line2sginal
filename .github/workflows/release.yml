name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# Pas de cache : GitHub limite un cache au tag qui l'a créé, un nouveau tag n'y aurait pas accès.
# Les vérifications (fmt, clippy, tests) se font en local avant de taguer.

# La release est créée d'abord, puis chaque build y attache son binaire dès qu'il a fini :
# un runner macOS lent ou en échec ne bloque pas Linux et Windows. Un « Re-run failed jobs »
# ajoute ensuite le binaire manquant à la même release.
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  linux:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Package
        run: |
          mkdir -p dist pkg
          cp target/release/line2signal assets/line2signal.desktop pkg/
          cp assets/icon.png pkg/line2signal.png
          tar -czf dist/line2signal-linux-x86_64.tar.gz -C pkg .
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  windows:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/line2signal.exe dist/line2signal-windows-x86_64.exe
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  macos:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Package universal .app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP="dist/LINE to Signal.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp assets/icon.icns "$APP/Contents/Resources/icon.icns"
          lipo -create -output "$APP/Contents/MacOS/line2signal" \
            target/aarch64-apple-darwin/release/line2signal \
            target/x86_64-apple-darwin/release/line2signal
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>LINE to Signal</string>
            <key>CFBundleDisplayName</key><string>LINE to Signal</string>
            <key>CFBundleIdentifier</key><string>io.github.line2signal</string>
            <key>CFBundleExecutable</key><string>line2signal</string>
            <key>CFBundleIconFile</key><string>icon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          cd dist && ditto -c -k --keepParent "LINE to Signal.app" line2signal-macos-universal.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
