[package]
name = "line2signal"
version = "0.1.0"
edition = "2021"
description = "Convertit un pack de stickers LINE en pack de stickers Signal"

[dependencies]
anyhow = "1"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
color_quant = "1.1"
directories = "6"
eframe = "0.32"
hkdf = "0.12"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["png"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }
png = "0.17"
prost = "0.13"
rand = "0.8"
rayon = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "multipart", "json"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true

# La conversion d'images est très lente sans optimisations.
[profile.dev.package."*"]
opt-level = 3
